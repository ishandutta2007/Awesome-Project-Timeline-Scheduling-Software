<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }

    /* Ambient Dynamic Pulsing and Scanning Elements */
    @keyframes scanline {
      0% { transform: translateX(0px); opacity: 0.2; }
      50% { transform: translateX(700px); opacity: 0.8; }
      100% { transform: translateX(0px); opacity: 0.2; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.25; }
      50% { opacity: 0.6; }
      100% { opacity: 0.25; }
    }
    @keyframes barSlide1 {
      0% { width: 140px; }
      50% { width: 220px; }
      100% { width: 140px; }
    }
    @keyframes barSlide2 {
      0% { width: 180px; }
      50% { width: 260px; }
      100% { width: 180px; }
    }
    @keyframes barSlide3 {
      0% { width: 130px; }
      50% { width: 200px; }
      100% { width: 130px; }
    }
    @keyframes flowDot {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }

    .scanner {
      animation: scanline 8s ease-in-out infinite;
    }
    .ambient-glow {
      animation: pulseGlow 5s ease-in-out infinite;
    }
    .animated-bar-1 {
      animation: barSlide1 7s ease-in-out infinite;
    }
    .animated-bar-2 {
      animation: barSlide2 9s ease-in-out infinite;
    }
    .animated-bar-3 {
      animation: barSlide3 6s ease-in-out infinite;
    }
    .flowing-path {
      stroke-dasharray: 6 6;
      animation: flowDot 3s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Decorative Background Glows (behind foreground) -->
  <circle cx="150" cy="80" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="ambient-glow" />
  <circle cx="1050" cy="280" r="160" fill="#a855f7" opacity="0.1" filter="url(#glow)" class="ambient-glow" />

  <!-- Background Dynamic Gantt Watermark Lines (Low contrast, behind content) -->
  <g opacity="0.45">
    <!-- Grid timeline vertical columns -->
    <line x1="280" y1="230" x2="280" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="480" y1="230" x2="480" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="680" y1="230" x2="680" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="880" y1="230" x2="880" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1080" y1="230" x2="1080" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Animated Timeline Bars along the lower lane -->
    <!-- Lane 1 -->
    <rect x="80" y="246" width="160" height="18" rx="9" fill="url(#accentCyan)" class="animated-bar-1" opacity="0.85" />
    <text x="90" y="259" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="600">Sprint Roadmap</text>

    <!-- Dependency connection -->
    <path d="M 240 255 L 290 255 L 290 282 L 310 282" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flowing-path" />

    <!-- Lane 2 -->
    <rect x="310" y="273" width="220" height="18" rx="9" fill="url(#accentPurple)" class="animated-bar-2" opacity="0.85" />
    <text x="320" y="286" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="600">Critical Path Analysis</text>

    <!-- Dependency connection -->
    <path d="M 530 282 L 580 282 L 580 309 L 600 309" fill="none" stroke="#c084fc" stroke-width="1.5" class="flowing-path" />

    <!-- Lane 3 -->
    <rect x="600" y="300" width="180" height="18" rx="9" fill="url(#accentEmerald)" class="animated-bar-3" opacity="0.85" />
    <text x="610" y="313" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="600">Milestone Delivery</text>

    <!-- Lane 4 Milestone Diamond -->
    <path d="M 830 309 L 840 299 L 850 309 L 840 319 Z" fill="url(#accentAmber)" />
    <text x="860" y="313" font-family="sans-serif" font-size="10" fill="#fbbf24" font-weight="700">RELEASE 2026.11</text>

    <!-- Dynamic Scanning Radar Bar -->
    <rect x="250" y="235" width="3" height="95" fill="#38bdf8" filter="url(#glow)" class="scanner" />
  </g>

  <!-- Foreground Title and Hero Content (Clean & High Contrast) -->
  <g>
    <!-- Category Pill -->
    <rect x="70" y="42" width="220" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="86" cy="56" r="4" fill="#38bdf8" />
    <text x="98" y="60" class="badge-text" fill="#38bdf8">GANTT &amp; TIMELINE SCHEDULING</text>

    <!-- Main Title -->
    <text x="70" y="115" class="title">Project Timeline &amp; Scheduling</text>

    <!-- Subtitle / Meta -->
    <text x="70" y="152" class="subtitle">Curated SaaS Platforms, Self-Hosted Engines, DAG Solvers &amp; Open-Source Planners</text>

    <!-- Feature Tags Row -->
    <g transform="translate(70, 178)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="138" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="12" y="17" class="badge-text">⚡ Critical Path (CPM)</text>

      <!-- Tag 2 -->
      <rect x="148" y="0" width="144" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="12" y="17" transform="translate(148,0)" class="badge-text">📊 Interactive Gantt</text>

      <!-- Tag 3 -->
      <rect x="302" y="0" width="140" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="12" y="17" transform="translate(302,0)" class="badge-text">🔒 Self-Hosted Privacy</text>

      <!-- Tag 4 -->
      <rect x="452" y="0" width="148" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="12" y="17" transform="translate(452,0)" class="badge-text">🔄 Baseline Tracking</text>
    </g>
  </g>
</svg>
